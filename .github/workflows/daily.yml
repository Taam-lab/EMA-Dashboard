name: daily-update

# 평일 15:05 KST = 06:05 UTC (같은 날). 한국 월~금 = UTC 월~금(1-5).
#
# 왜 마감(15:30) 전인가: 진입 조건이 '당일 등락률 -5~0%' 라 신호가 종가에 의존하는데,
# 종가를 안 뒤에는 그 가격에 살 수 없다. 그래서 마감 직전 스냅샷을 종가 대용으로 삼아
# 판정하고 그 가격에 체결한 것으로 기록한다 — 판정과 주문 시점이 같아 룩어헤드가 없다.
#
# 15:05 로 잡은 건 Actions 스케줄이 부하에 따라 수십 분 밀리기 때문. 밀려서 15:30 을
# 넘기면 run_daily 가 알아서 '확정 종가' 기준으로 전환한다(기록은 정상, 주문 타이밍만 놓침).
on:
  schedule:
    - cron: "5 6 * * 1-5"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 결과 JSON을 저장소에 커밋하기 위해

concurrency:                # 중복 실행 시 커밋 충돌 방지
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pykrx 가격 캐시(data/) 를 실행 간 재사용해 속도 향상.
      # 키에 날짜를 넣어야 매일 '갱신된' 캐시가 새로 저장됨.
      # (키가 고정이면 캐시 적중 시 저장을 건너뛰어 첫날 캐시에 영원히 묶임)
      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-

      - name: Install deps
        run: pip install -r requirements-daily.txt

      # KRX 가 로그인 필수로 바뀌어 pykrx 조회에 계정이 필요함.
      # 저장소 Settings → Secrets and variables → Actions 에 KRX_ID / KRX_PW 등록 필요.
      - name: Run daily update
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python run_daily.py

      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add portfolio_state.json snapshot.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "daily update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
