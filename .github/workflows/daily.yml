name: daily-update

# 평일 16:30 KST = 07:30 UTC (같은 날). 한국 월~금 = UTC 월~금(1-5).
#
# 주 경로가 아니라 '안전망'이다. 실제 운용은 PC 작업 스케줄러(daily.ps1)가
# 08:00 / 15:05 에 돌린다 — Actions 예약 실행은 best-effort 라 정시성이 없어서
# (실측: 9/10 5시간 지연, 9/11 미실행) 마감 25분 전이라는 타이밍을 지킬 수 없다.
#
# 여기서는 마감 이후에 돌아 두 가지만 한다:
#   1) PC 가 꺼져 있어 15:05 를 놓친 날의 기록을 확정 종가로 메운다
#   2) 이미 처리된 날이면 매매 없이 평가만 확정 종가로 갱신한다
#
# 16:30 인 이유: 주문 구간(15:00~15:30)과 겹치면 로컬 실행과 같은 날을 두고
# 경쟁해 진입가가 몇 분 차이로 달라진다. 마감 후로 빼서 경쟁 자체를 없앤다.
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 결과 JSON을 저장소에 커밋하기 위해

concurrency:                # 중복 실행 시 커밋 충돌 방지
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pykrx 가격 캐시(data/) 를 실행 간 재사용해 속도 향상.
      # 키에 날짜를 넣어야 매일 '갱신된' 캐시가 새로 저장됨.
      # (키가 고정이면 캐시 적중 시 저장을 건너뛰어 첫날 캐시에 영원히 묶임)
      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-

      - name: Install deps
        run: pip install -r requirements-daily.txt

      # KRX 가 로그인 필수로 바뀌어 pykrx 조회에 계정이 필요함.
      # 저장소 Settings → Secrets and variables → Actions 에 KRX_ID / KRX_PW 등록 필요.
      - name: Run daily update
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python run_daily.py

      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add portfolio_state.json snapshot.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "daily update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
